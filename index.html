<!DOCTYPE html>
<html lang="es">
<head>

<style>

}
    #panel-lista{
    position:absolute;
    top:220px;
    left:15px;
    width:250px;
    max-height:400px;
    overflow-y:auto;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    z-index:999;
}
</style>

</head>

<body>
<script>

const password = prompt("Contraseña:");

if(password !== "Movimiento2027"){

    document.body.innerHTML = "<h1>Acceso denegado</h1>";

    throw new Error("Sin acceso");

}

</script>
<div id="capas">

<label>

type="checkbox"
checked
onchange="toggleLayer('pins'); actualizarLista();"> 
    Servicios
-->
<input id="checkHistorico" type="checkbox">
Histórico 2024
<input id="checkSenador"
type="checkbox"
checked
onchange="toggleLayer('pins-senador'); actualizarLista();">
    Senador

<input id="checkEquipo"
type="checkbox"
checked
onchange="toggleLayer('pins-equipo'); actualizarLista();">
    Equipo
</label>

</div>
    <div id="panel-lista">

<h3>Actividades</h3>

<div id="lista-actividades">

Cargando...

</div>

</div>
<div id="buscador">

    <input type="number"
           id="seccionInput"
           placeholder="Buscar sección">

    <button onclick="buscarSeccion()">Ir</button>

    <br><br>

    <input type="number"
           id="dfedInput"
           placeholder="Distrito Federal">

    <button onclick="buscarDFED()">Ir</button>

</div>
<div id="map"></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken =
"pk.eyJ1IjoiamRhcmlvdnoiLCJhIjoiY21wbGx4bTJ6MjZ3NDJ4cHQ2Y3NvcTA3bCJ9.wCONIcDFuubKj_Irb8NdRQ";

let todasLasSecciones = [];
    
const map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/jdariovz/cmplmosub009r01snddodbh7z",
    center: [-100.3161, 25.6866],
    zoom: 10.2
});

function buscarSeccion(){

    const seccion = document
        .getElementById("seccionInput")
        .value
        .trim();

    if(!seccion) return;

const features = todasLasSecciones;
    
   // Buscar todas las secciones que tengan esa sección histórica
let encontradas = features.filter(
    f => String(f.properties.SECCION_2024_ASIGNADA) === seccion
);

// Si no encontró nada, probar como sección actual
if(encontradas.length === 0){

    encontradas = features.filter(
        f => String(f.properties.SECCION_2026) === seccion
    );

}

    if(encontradas.length === 0){
        alert("Sección no encontrada");
        return;
    }

    // Resaltar todas las encontradas
    const secciones2026 = [
    ...new Set(
        encontradas.map(f => f.properties.SECCION_2026)
    )
];

map.setFilter(
    "resaltado-seccion",
    ["in","SECCION_2026", ...secciones2026]
);
    const bounds = new mapboxgl.LngLatBounds();

    encontradas.forEach(feature => {

        let coords;

        if(feature.geometry.type === "Polygon"){
            coords = feature.geometry.coordinates[0];
        } else {
            coords = feature.geometry.coordinates[0][0];
        }

        coords.forEach(coord => bounds.extend(coord));

    });

    map.fitBounds(bounds,{
        padding:40
    });

}

function toggleLayer(id){

    const visible =
        map.getLayoutProperty(id,"visibility");

    if(visible === "none"){

        map.setLayoutProperty(
            id,
            "visibility",
            "visible"
        );

    } else {

        map.setLayoutProperty(
            id,
            "visibility",
            "none"
        );

    }

}
   function actualizarLista(){

    let html = "";

    Promise.all([

        fetch("https://script.google.com/macros/s/AKfycbz-KYyqBIAkw6DgSOcg9iIPTrbtK3zjQbiCBpeS3i3L0VtqNS5kpxP1koutww8uYKvpKw/exec")
        .then(r => r.json()),

        fetch("https://script.google.com/macros/s/AKfycbz26NHWn4zO9T8QC8OAqfFleShlGG-iQG7vPErbpjCvFlbd0Iy5RfL4fncnqMGrmEJj7Q/exec")
        .then(r => r.json())

    ]).then(([senador, equipo]) => {

        // SENADOR
        if(document.getElementById("checkSenador").checked){

            senador.features.forEach(item => {

                html += `
                <div
                style="
                margin-bottom:15px;
                padding-bottom:10px;
                border-bottom:1px solid #ddd;
                cursor:pointer;
                "
                onclick="irActividad(
                ${item.geometry.coordinates[0]},
                ${item.geometry.coordinates[1]}
                )">

                <b>${new Date(item.properties.fecha).toLocaleDateString("es-MX")}</b><br>

                ${item.properties.actividad}<br>

                <small>${item.properties.ubicacion}</small>

                </div>
                `;

            });

        }

        // EQUIPO
        if(document.getElementById("checkEquipo").checked){

            equipo.features.forEach(item => {

                html += `
                <div
                style="
                margin-bottom:15px;
                padding-bottom:10px;
                border-bottom:1px solid #ddd;
                cursor:pointer;
                "
                onclick="irActividad(
                ${item.geometry.coordinates[0]},
                ${item.geometry.coordinates[1]}
                )">

                <b>${new Date(item.properties.fecha).toLocaleDateString("es-MX")}</b><br>

                ${item.properties.actividad}<br>

                <small>${item.properties.ubicacion}</small>

                </div>
                `;

            });

        }

        if(html === ""){
            html = "Sin elementos";
        }

        document.getElementById("lista-actividades").innerHTML = html;

    });

}
    function irActividad(lng, lat){

    map.flyTo({
        center:[lng,lat],
        zoom:16
    });

}
function buscarDFED(){

    const dfed = document
        .getElementById("dfedInput")
        .value
        .trim();

    if(!dfed) return;

    const encontradas = todasLasSecciones.filter(
        f => String(f.properties.DFED_2026) === dfed
    );

    if(encontradas.length === 0){
        alert("Distrito no encontrado");
        return;
    }

    // Resaltar todas las secciones del distrito
    map.setFilter(
        "resaltado-seccion",
        ["in","SECCION_2026",
            ...encontradas.map(f => f.properties.SECCION_2026)
        ]
    );

    const bounds = new mapboxgl.LngLatBounds();

    encontradas.forEach(feature => {

        let coords;

        if(feature.geometry.type === "Polygon"){
            coords = feature.geometry.coordinates[0];
        } else {
            coords = feature.geometry.coordinates[0][0];
        }

        coords.forEach(coord => bounds.extend(coord));

    });

    map.fitBounds(bounds,{
        padding:40
    });

}
map.on("load",()=>{

    // Servicios
    map.addSource("simpatizantes",{
        type:"geojson",
        data:"https://script.google.com/macros/s/AKfycbxLaxqrumjT7zqjryDygDedvAejU04S46ZNVO70ROV9ylbPrqUpbbdkRMWwECDUMuI3/exec"
    });
    map.addSource("senador", {
  type: "geojson",
  data: "https://script.google.com/macros/s/AKfycbz-KYyqBIAkw6DgSOcg9iIPTrbtK3zjQbiCBpeS3i3L0VtqNS5kpxP1koutww8uYKvpKw/exec"
});
    
map.addSource("equipo", {
  type: "geojson",
  data: "https://script.google.com/macros/s/AKfycbz26NHWn4zO9T8QC8OAqfFleShlGG-iQG7vPErbpjCvFlbd0Iy5RfL4fncnqMGrmEJj7Q/exec"
});
    map.addLayer({
        id:"pins",
        type:"circle",
        source:"simpatizantes",
        paint:{
            "circle-radius":8,
            "circle-color":"#00e5ff",
            "circle-stroke-width":2,
            "circle-stroke-color":"#ffffff"
        }
    });
    map.setLayoutProperty(
    "pins",
    "visibility",
    "none"
);
    map.addLayer({
  id: "pins-senador",
  type: "circle",
  source: "senador",
  paint: {
    "circle-radius": 8,
    "circle-color": "#ff0000",
    "circle-stroke-width": 2,
    "circle-stroke-color": "#ffffff"
  }
});
    map.addLayer({
  id: "pins-equipo",
  type: "circle",
  source: "equipo",
  paint: {
    "circle-radius": 8,
    "circle-color": "#00aa00",
    "circle-stroke-width": 2,
    "circle-stroke-color": "#ffffff"
  }
});

    // GeoJSON completo del estado
    map.addSource("secciones-local",{
    type:"geojson",
    data:"PRIORIDAD 2027.geojson"
});
    fetch("PRIORIDAD%202027.geojson")
    .then(r => r.json())
    .then(data => {

        todasLasSecciones = data.features;

        console.log(
            "Secciones cargadas:",
            todasLasSecciones.length
        );

    });

    // Resaltado amarillo
    map.addLayer({
        id:"resaltado-seccion",
        type:"line",
        source:"secciones-local",
        paint:{
            "line-color":"#ffff00",
            "line-width":5
        },
        filter:["in","SECCION_2026",""]
    });
    map.addLayer({
    id:"historico-2024",
    type:"fill",
    source:"secciones-local",
    paint:{
        "fill-color":"#7CFC00",
        "fill-opacity":0.15
    },
    filter: ["!=", ["get","SECCION_2024_ASIGNADA"], ["get","SECCION_2026"]]
});
    map.addLayer({
    id:"historico-2024-linea",
    type:"line",
    source:"secciones-local",
    paint:{
        "line-color":"#FFFFFF",
        "line-width":2
    },
    filter: ["!=", ["get","SECCION_2024_ASIGNADA"], ["get","SECCION_2026"]]
});
    map.addLayer({
    id:"historico-2024-label",
    type:"symbol",
    source:"secciones-local",
    layout:{
        "text-field":["to-string",["get","SECCION_2024_ASIGNADA"]],
        "text-size":16
    },
    paint:{
        "text-color":"#ffffff",
        "text-halo-color":"#000000",
        "text-halo-width":1.5
    },
    filter: ["!=", ["get","SECCION_2024_ASIGNADA"], ["get","SECCION_2026"]]
});
map.setLayoutProperty("historico-2024","visibility","none");
map.setLayoutProperty("historico-2024-linea","visibility","none");
map.setLayoutProperty("historico-2024-label","visibility","none");
    
    document.getElementById("checkHistorico").addEventListener("change", function() {

    const visible = this.checked ? "visible" : "none";

    map.setLayoutProperty("historico-2024", "visibility", visible);
    map.setLayoutProperty("historico-2024-linea", "visibility", visible);
    map.setLayoutProperty("historico-2024-label", "visibility", visible);

});

    // Popups
    map.on("click","pins",(e)=>{

        const props = e.features[0].properties;

        new mapboxgl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(`
            <h3>${props.nombre}</h3>

            <p>
            <b>Servicio:</b><br>
            ${props.servicio}
            </p>

            <p>
            <b>Status:</b><br>
            ${props.status}
            </p>
        `)
        .addTo(map);

    });
    map.on("click", "pins-senador", (e) => {

  const props = e.features[0].properties;

  new mapboxgl.Popup()
    .setLngLat(e.lngLat)
    .setHTML(`
      <h3>Actividad del Senador</h3>

      <p>
        <b>Fecha:</b><br>
        ${new Date(props.fecha).toLocaleDateString(
    "es-MX",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
)}
      </p>

      <p>
        <b>Actividad:</b><br>
        ${props.actividad}
      </p>

      <p>
        <b>Ubicación:</b><br>
        ${props.ubicacion}
      </p>

      <p>
        <b>Aforo:</b><br>
        ${props.aforo}
      </p>

      <p>
        <b>Comentario:</b><br>
        ${props.comentario}
      </p>
    `)
    .addTo(map);

});
    map.on("click", "pins-equipo", (e) => {

  const props = e.features[0].properties;

  new mapboxgl.Popup()
    .setLngLat(e.lngLat)
    .setHTML(`
      <h3>Actividad del Equipo</h3>

      <p>
        <b>Fecha:</b><br>
        ${new Date(props.fecha).toLocaleDateString(
    "es-MX",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
)}
      </p>

      <p>
        <b>Actividad:</b><br>
        ${props.actividad}
      </p>

      <p>
        <b>Ubicación:</b><br>
        ${props.ubicacion}
      </p>

      <p>
        <b>Aforo:</b><br>
        ${props.aforo}
      </p>

      <p>
        <b>Comentario:</b><br>
        ${props.comentario}
      </p>
    `)
    .addTo(map);

});

actualizarLista();
    });   // ← cierre del map.on("load")
</script>

</body>
</html>
